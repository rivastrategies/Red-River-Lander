<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting | Red River Restaurants</title>
    <meta http-equiv="refresh" content="0; url=https://redriverrestaurants.com/privacy-policy/">
    <link rel="canonical" href="https://redriverrestaurants.com/privacy-policy/">
    <script>
        (function () {
            var target = "https://redriverrestaurants.com/privacy-policy/";

            if (window.location.href === target) {
                return;
            }

            try {
                window.location.replace(target);
            } catch (error) {
                window.location.href = target;
            }
        })();
    </script>
</head>
<body>
    <p>Redirecting to <a href="https://redriverrestaurants.com/privacy-policy/">Privacy Policy</a>...</p>
    <script>
        window.location.href = "https://redriverrestaurants.com/privacy-policy/";
    </script>
</body>
</html>
